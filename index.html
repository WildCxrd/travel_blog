<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_home.css">
</head>

<body>

    <header class="primary-green-background">
        <img class="blog-logo" src="./assets/icons/logo.svg"
            alt="Das Logo des Travel Blog - die Erdkugel, die von einem Flugzeug gegen der Uhrzeigersinn umkreist wird.">

        <nav>
            <ul>
                <li>
                    <a href="">Highlights</a>
                </li>
                <li>
                    <a href="">FAQ</a>
                </li>
                <li>
                    <a href="">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main style="height: 600px;">

    </main>

    <footer class="primary-green-background">
        <div class="footer-panel">
            <div class="meta-informations">
                <ul>
                    <li>
                        <figure>
                            <img src="./assets/icons/copyright.svg" alt="Das Copyright-Logo">
                            <p>Travel Blog 2026</p>
                        </figure>
                    </li>
                    <li>
                        <p>Imprint</p>
                    </li>
                    <li>
                        <p>Cookie Preferences</p>
                    </li>
                </ul>
            </div>

            <div class="social-media-icons">
                <ul>
                    <li>
                        <a href="https://www.tiktok.com/" target="_blank">
                            <img class="social-media-icon-rectangular" src="./assets/icons/tiktok.svg"
                                alt="Das TikTok-Logo.">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.youtube.com/" target="_blank">
                            <img class="youtube-icon" src="./assets/icons/youtube.svg" alt="Das YouTube-Logo.">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.facebook.com/" target="_blank">
                            <img class="social-media-icon-rectangular" src="./assets/icons/facebook.svg"
                                alt="Das Facebook-Logo.">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/" target="_blank">
                            <img class="social-media-icon-rectangular" src="./assets/icons/instagram.svg"
                                alt="Das Instagram-Logo.">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </footer>

</body>

</html>
