<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Blog</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_header_and_footer.css">
    <link rel="stylesheet" href="style_menu_bar.css">
    <link rel="stylesheet" href="style_home.css">

    <link rel="icon" type="image/x-icon" href="./assets/icons/logo.svg">
</head>

<body>
    <main>
        <header class="primary-green-background">
            <img class="blog-logo" src="./assets/icons/logo.svg"
                alt="Das Logo des Travel Blog - die Erdkugel, die von einem Flugzeug gegen der Uhrzeigersinn umkreist wird.">

            <nav>
                <ul>
                    <li>
                        <a href="">Highlights</a>
                    </li>
                    <li>
                        <a href="">FAQ</a>
                    </li>
                    <li>
                        <a href="">Contact</a>
                    </li>
                </ul>
            </nav>
        </header>

        <section class="home-hero">
            <img src="./assets/svg/hero-left-vector.svg" alt="">
        </section>

        <section class="home-highlights">
            <div class="highlights-headline">
                <img src="/assets/icons/rocket_launch_yellow.svg" alt="Eine abhebende gelbe Rakete.">
                <h2>Highlights</h2>
            </div>

        </section>

        <section class="home-faq">

        </section>

        <section class="home-contact">

        </section>
    </main>

    <footer class="primary-green-background">
        <div class="footer-panel">
            <div class="meta-informations">
                <ul>
                    <li>
                        <figure>
                            <img src="./assets/icons/copyright.svg" alt="Das Copyright-Logo">
                            <p>Travel Blog 2026</p>
                        </figure>
                    </li>
                    <li>
                        <p>Imprint</p>
                    </li>
                    <li>
                        <p>Cookie Preferences</p>
                    </li>
                </ul>
            </div>

            <div class="social-media-icons">
                <ul>
                    <li>
                        <a href="https://www.tiktok.com/" target="_blank">
                            <img class="social-media-icon-rectangular" src="./assets/icons/tiktok.svg"
                                alt="Das TikTok-Logo.">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.youtube.com/" target="_blank">
                            <img class="youtube-icon" src="./assets/icons/youtube.svg" alt="Das YouTube-Logo.">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.facebook.com/" target="_blank">
                            <img class="social-media-icon-rectangular" src="./assets/icons/facebook.svg"
                                alt="Das Facebook-Logo.">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/" target="_blank">
                            <img class="social-media-icon-rectangular" src="./assets/icons/instagram.svg"
                                alt="Das Instagram-Logo.">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </footer>

    <nav class="menu-bar yellow-background">
        <ul>
            <li>
                <img src="./assets/icons/home.svg" alt="Das Home-Symbol - der Umriss eines Hauses.">
            </li>
            <li>
                <img src="./assets/icons/rocket_launch.svg" alt="Das Symbol einer fliegenden Rakete..">
            </li>
            <li>
                <img src="./assets/icons/live_help.svg"
                    alt="Das Symbol zur Live-Hilfe - ein Fragezeichen in einer Sprechblase mit abgerundeten Ecken.">
            </li>
            <li>
                <img src="./assets/icons/person_pin.svg"
                    alt="Das Person-Symbol - die Silhouette einer Person in einer Sprechblase mit abgerundeten Ecken.">
            </li>
        </ul>
    </nav>

</body>

</html>
