<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slider</title>

        <link rel="stylesheet" href="style_partical_carousel.css">
        <link rel="stylesheet" href="style.css">


</head>

<body>
        <section class="carousel-section">
                <h2 class="carousel-heading">
                        TOP 5 beach destinations for 2026
                </h2>
                <div class="slider_b">
                        <img id="beach-1" class="slider_b_element" src="assets/img/carou_01.png" alt="Palm beach">
                        <img id="beach-2" class="slider_b_element" src="assets/img/carou_02.png" alt="Palm club">
                        <img id="beach-3" class="slider_b_element" src="assets/img/carou_03.png" alt="Palm Sea">
                        <img id="beach-4" class="slider_b_element" src="assets/img/carou_04.png" alt="Palm sandy">
                        <img id="beach-5" class="slider_b_element" src="assets/img/carou_05.png" alt="Palm windy">
                </div>
                <div class="carousel-dots" role="group" aria-label="Choose beach destination">

                        <a href="#beach-1" class="carousel-dot is-active" aria-label="Show beach 1"></a>

                        <a href="#beach-2" class="carousel-dot" aria-label="Show beach 2"></a>

                        <a href="#beach-3" class="carousel-dot" aria-label="Show beach 3"></a>

                        <a href="#beach-4" class="carousel-dot" aria-label="Show beach 4"></a>

                        <a href="#beach-5" class="carousel-dot" aria-label="Show beach 5"></a>

                </div>
        </section> 
</body>

</html>
